name: Docker Build

on:
  push:
    branches:
      - main
      - v0.2-docker

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Tags
        id: meta
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          BRANCH_LC=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]')
          SHA_SHORT=$(git rev-parse --short=8)
          
          echo "tag_latest=ghcr.io/${REPO_LC}:latest" >> $GITHUB_OUTPUT
          echo "tag_branch=ghcr.io/${REPO_LC}:${BRANCH_LC}" >> $GITHUB_OUTPUT
          echo "tag_sha=ghcr.io/${REPO_LC}:${BRANCH_LC}-${SHA_SHORT}" >> $GITHUB_OUTPUT

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.tag_latest }}
            ${{ steps.meta.outputs.tag_branch }}
            ${{ steps.meta.outputs.tag_sha }}